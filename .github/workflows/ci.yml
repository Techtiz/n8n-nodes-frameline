# Build + lint on every push and PR, so a broken commit never reaches a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run lint
      - run: npm run build
